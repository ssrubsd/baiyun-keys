name: Build-Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 配置 Java 环境（Android 构建必备）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. 配置 Flutter 环境（保持与你的 iOS 相同的 3.24.0 版本）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      # 3. 清理与获取依赖
      - name: flutter clean & pub get
        run: |
          flutter clean
          flutter pub get

      # 4. 动态重新生成/补全 android 目录 (解决 missing build.gradle 报错)
      - name: Regenerate Android project
        run: |
          # 如果之前提交过不完整的 android 目录，先清理掉
          rm -rf android
          # 重新生成 android 原生工程结构
          flutter create . --platforms android --project-name baiyun_keys

      # 5. 构建 release APK
      - name: Build APK
        run: flutter build apk --release

      # 6. 上传 Artifact (APK 产物)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiyun-apk
          path: build/app/outputs/flutter-apk/app-release.apk
