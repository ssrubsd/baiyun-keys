name: Build-Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 配置 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. 配置 Flutter 环境
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      # 3. 清理与获取依赖
      - name: flutter clean & pub get
        run: |
          flutter clean
          flutter pub get

      # 4. 动态生成 Android 目录 + 升级 Kotlin 版本 + 注入 SDK 变量
      - name: Regenerate & Configure Android Project
        run: |
          rm -rf android
          flutter create . --platforms android --project-name baiyun_keys

          # 强制将 settings.gradle 中的 Kotlin 插件升级到 1.9.24
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle

          # 注入旧版插件所需的全局变量
          cat << 'EOF' >> android/build.gradle

          ext.compileSdkVersion = 34
          ext.minSdkVersion = 21
          ext.targetSdkVersion = 34
          ext.flutter = [
              compileSdkVersion: 34,
              minSdkVersion: 21,
              targetSdkVersion: 34
          ]
          EOF

      # 5. 打包 Release APK
      - name: Build APK
        run: flutter build apk --release

      # 6. 上传 Artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiyun-apk
          path: build/app/outputs/flutter-apk/app-release.apk
